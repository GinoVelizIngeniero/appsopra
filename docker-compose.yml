version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sopraval_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sopraval
      POSTGRES_PASSWORD: sopraval2026
      POSTGRES_DB: sopraval_portal
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
